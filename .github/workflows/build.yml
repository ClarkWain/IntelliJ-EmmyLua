name: Build Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (leave empty for a development build)
        required: false
        type: string
  push:
    branches:
      - '*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: '2025'
            verify: '2025.1.7.2;2025.2.6.3;2025.3.6.1'
          - ide: '2026'
            verify: '2026.1.5;2026.2.3'

    env:
      CI: true
      CI_BUILD_VERSION: ${{ inputs.version || format('1.5.3-dev.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Gradle JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up IntelliJ JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Test and build ${{ matrix.ide }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          xvfb-run --auto-servernum ./gradlew test buildPlugin verifyPlugin -DIDEA_VER=${{ matrix.ide }} "-PverificationIdeVersions=${{ matrix.verify }}" --no-configuration-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: Lua-Insight-IDEA${{ matrix.ide }}
          path: build/distributions/*.zip

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: validation-IDEA${{ matrix.ide }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/pluginVerifier/
