name: Build Plugin

on:
  push:
    branches:
      - '*'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ide: ['2025.2', '2026.2']

    env:
      CI: true
      CI_BUILD_VERSION: 1.5.0-luanalysis.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Gradle JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up IntelliJ JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Test and build ${{ matrix.ide }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          xvfb-run --auto-servernum ./gradlew test buildPlugin -DIDEA_VER=${{ matrix.ide }} --no-configuration-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v${{ env.CI_BUILD_VERSION }}-IDEA${{ matrix.ide }}
          path: build/distributions/*.zip
