name: Publish to JetBrains Marketplace (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketplace version
        required: true
        type: string

permissions:
  contents: read

jobs:

  publish:

    runs-on: ubuntu-latest

    env:
      CI: true
      CI_BUILD_VERSION: ${{ inputs.version }}
      IDEA_PUBLISH_TOKEN: ${{ secrets.IDEA_PUBLISH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Gradle JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up IntelliJ JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Publish 2026
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew publishPlugin -DIDEA_VER=2026 --no-configuration-cache

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: v${{ env.CI_BUILD_VERSION }}
          path: build/distributions/*.zip
